<body style="font-family: Arial, sans-serif; padding: 24px;">

  <h1>Тест Яндекс.Метрики</h1>
  <p>Ниже — пара кнопок. Каждое нажатие отправляет цель в Метрику (пример).</p>

  <button id="btn1" style="padding:12px 18px; margin-right:10px;">Кнопка 1 — просто клик</button>
  <button id="btn2" style="padding:12px 18px;">Кнопка 2 — цель "purchase"</button>

  <p id="log" style="margin-top:16px;color:#333;">Статус: ожидание действий...</p>

  <script>
    function sendGoal(goalName, params) {
      try {
        if (window.ym) {
          ym(104303260, 'reachGoal', goalName, params);
          console.log('ym called:', goalName, params);
          document.getElementById('log').textContent = 'Отправлена цель: ' + goalName;
        } else {
          console.log('ym not ready yet, queuing:', goalName);
          document.getElementById('log').textContent = 'ym ещё не загрузился — цель поставлена в очередь';
        }
      } catch (e) {
        console.error(e);
        document.getElementById('log').textContent = 'Ошибка при отправке цели: ' + e.message;
      }
    }

    document.getElementById('btn1').addEventListener('click', function(){
      sendGoal('button_click_1');
    });

    document.getElementById('btn2').addEventListener('click', function(){
      sendGoal('purchase_test', { value: 123, currency: 'RUB' });
    });
  </script>
